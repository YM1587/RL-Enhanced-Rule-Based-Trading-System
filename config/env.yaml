# Environment Configuration
ticker: "BTC-USD"
timeframe: "1h"
window_size: 50  # Observation window
initial_balance: 10000.0
trading_fee: 0.001  # 0.1% per trade
slippage_model: "fixed_0.0005"  # 5bps slippage
obs_components:
  - "returns"
  - "volatility"
  - "signal_distance"
  - "position_state"
